name: Actualización de datos QQQ

# ---------------------------------------------------------------------------
# GitHub Actions ejecuta los "schedule" siempre en UTC y no ajusta el horario
# de verano. Como EE. UU. alterna entre EST (UTC-5) y EDT (UTC-4), cada
# horario "de pared" en Nueva York equivale a DOS horas UTC distintas según
# la época del año. Por eso cada disparador tiene dos entradas de cron (una
# para EST y otra para EDT), y el primer paso de cada job verifica la hora
# real en America/New_York, descartando la ejecución que no corresponda.
# Así el job siempre corre a la hora correcta de Nueva York, todo el año.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '30 12,13 * * 1-5'    # 8:30 AM hora del Este -> job update-weights
    - cron: '0,30 13-21 * * 1-5'  # 9:30-16:00 hora del Este cada 30 min -> job update-prices
  workflow_dispatch:               # permite ejecutar el workflow manualmente desde la UI

permissions:
  contents: write   # necesario para que el bot pueda commitear y pushear a main

jobs:
  update-weights:
    name: Actualizar pesos (8:30 AM ET)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 12,13 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar hora real en Nueva York
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now_et=$(TZ='America/New_York' date +'%H:%M')
          echo "Hora actual en Nueva York: $now_et"
          # Tolerancia de +/-10 min por si GitHub Actions retrasa el disparo
          if [[ "$now_et" > "08:24" && "$now_et" < "08:40" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout del repositorio
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar entorno Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        if: steps.gate.outputs.should_run == 'true'
        run: pip install yfinance pandas

      - name: Ejecutar actualización de pesos
        if: steps.gate.outputs.should_run == 'true'
        # Ajustar esta ruta si el script vive en otro lugar del repo
        run: python scripts/update_weights.py

      - name: Commit y push de qqq_data.json
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qqq_data.json
          git diff --staged --quiet && echo "Sin cambios, nada que commitear" || git commit -m "chore: actualizar pesos QQQ [skip ci]"
          git push origin main

  update-prices:
    name: Actualizar precios (cada 30 min, 9:30-16:00 ET)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0,30 13-21 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar hora real en Nueva York
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now_et=$(TZ='America/New_York' date +'%H:%M')
          echo "Hora actual en Nueva York: $now_et"
          if [[ "$now_et" < "09:30" || "$now_et" > "16:00" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout del repositorio
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar entorno Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        if: steps.gate.outputs.should_run == 'true'
        run: pip install yfinance pandas

      - name: Ejecutar actualización de precios
        if: steps.gate.outputs.should_run == 'true'
        # Ajustar esta ruta si el script vive en otro lugar del repo
        run: python scripts/update_prices.py

      - name: Commit y push de qqq_data.json
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qqq_data.json
          git diff --staged --quiet && echo "Sin cambios, nada que commitear" || git commit -m "chore: actualizar precios QQQ [skip ci]"
          git push origin main